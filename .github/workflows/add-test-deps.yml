name: add-test-deps (tạm thời)

on:
  push:
    branches: [feat/phase-0-1-safety-foundation]
    paths: [".github/workflows/add-test-deps.yml"]

permissions:
  contents: write

jobs:
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Thêm vitest và playwright vào devDependencies
        run: npm install --save-dev --no-audit --no-fund --ignore-scripts vitest@^3 @vitest/coverage-v8@^3 @playwright/test@^1
      - name: Commit package.json và package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): add vitest, coverage-v8 and playwright (generated by CI)"
          git push origin HEAD:${{ github.ref_name }}
