name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Giá trị giả chỉ để prisma validate / build chạy được. KHÔNG phải secret thật
      # và CI không bao giờ kết nối tới database thật.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      ADMIN_SESSION_SECRET: ci-only-admin-secret-0000000000000000
      CUSTOMER_SESSION_SECRET: ci-only-customer-secret-00000000000000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Customer support evals
        run: npm run eval:customer-support

      - name: Build
        run: npm run build
