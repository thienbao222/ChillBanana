name: gen-baseline (tạm thời)

on:
  push:
    branches: [feat/phase-0-1-safety-foundation]
    paths: [".github/workflows/gen-baseline.yml"]

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sinh SQL baseline từ schema gốc (ef9e20c)
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          git show ef9e20c:prisma/schema.prisma > "$RUNNER_TEMP/old.prisma"
          npx prisma migrate diff --from-empty --to-schema-datamodel "$RUNNER_TEMP/old.prisma" --script > "$RUNNER_TEMP/0_init.sql"
          mkdir -p prisma/migrations/0_init
          cp "$RUNNER_TEMP/0_init.sql" prisma/migrations/0_init/migration.sql
          wc -l prisma/migrations/0_init/migration.sql
      - name: Commit baseline vào nhánh
        run: |
          if [ -f prisma/migrations/0_init/migration.sql ] && ! git diff --quiet HEAD -- prisma/migrations/0_init 2>/dev/null || [ -n "$(git status --porcelain prisma/migrations/0_init)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add prisma/migrations/0_init
            git commit -m "chore(db): add baseline migration 0_init (generated by CI from ef9e20c schema)"
            git push origin HEAD:${{ github.ref_name }}
          fi
